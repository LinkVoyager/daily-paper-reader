          query: research papers on autonomous driving systems and algorithms
        - keyword: vision language action
          keyword_cn: 视觉-语言-动作
          query: papers on vision-language-action models for embodied decision making
        - keyword: end-to-end autonomous driving
          keyword_cn: 端到端自动驾驶
          query: end-to-end learning methods for autonomous driving from perception to control
        - keyword: trajectory planning
          keyword_cn: 轨迹规划
          query: trajectory planning and motion prediction for autonomous vehicles
        - keyword: embodied artificial intelligence
          keyword_cn: 具身智能
          query: embodied artificial intelligence for perception-action loops in agents
        - keyword: driving world model
          keyword_cn: 驾驶世界模型
          query: world models for simulating and reasoning about driving scenes
      intent_queries:
        - query: papers on vision language action models for autonomous driving
          query_cn: 关于自动驾驶视觉语言动作模型的论文
          enabled: true
          source: manual
          note: ''
